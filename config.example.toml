# 明日方舟wiki插件 示例配置文件
# 请勿将包含你个人配置的 config.toml 提交到公开仓库

[plugin]
enabled = true
config_version = "0.2.0"

[scope]
# 留空表示全会话生效；支持群 ID / 用户 ID，或带平台前缀如 qq:123456
group_whitelist = []
group_blacklist = []
private_whitelist = []
private_blacklist = []

[context]
# 检测到群聊/私聊出现方舟黑话或干员名时，向 Planner 尾部追加简短参考小抄（≤180字）
enable_planner_hint = true
# 命中方舟语境时提醒 Replyer 用自然玩家口吻聊天，不长篇背百科
enable_replyer_style_hint = true
# 命中高置信方舟词后，该会话保持方舟讨论热态的秒数（用于辅助放行“叔叔”“小羊”等多义词）
hot_session_ttl_seconds = 300
# 单轮最多注入的词条参考数
max_hint_items = 6

[commands]
# 是否启用快捷斜杠指令 /方舟 与 /立绘
enable_commands = true
# 允许在群聊中执行 /方舟 清理缓存 的管理员用户 ID 列表（支持纯 ID 或 platform:id）
# 留空时将自动尝试读取 MaiBot 宿主配置中的 master_users；均未配置时仅允许私聊清理
admin_users = []

[prts]
# PRTS MediaWiki API 地址
api_url = "https://prts.wiki/api.php"
# 礼貌 User-Agent（遵循 MediaWiki API 规范）
user_agent = "MaiBot-ArknightsWiki/0.2.0 (+https://github.com/Allure-Gui/maibot-arknights-wiki)"
# 单次网络请求超时（秒）
timeout_seconds = 12.0
# 两次请求 PRTS 之间的最小间隔（毫秒，建议 ≥ 500 保护社区服务器）
min_request_interval_ms = 500
# 立绘清晰度宽度上限（像素，1600 高清且原图≤3.5MB直出无损；0 表示始终原图）
illustration_thumb_width = 1600

[render]
# 是否开启罗德岛工业风 2x Retina 卡片图渲染（材料/模组/干员面板）
enable_cards = true
# 聊天中群友询问材料/模组时，自动附发一张高清卡片图
auto_card_in_chat = true
# 卡片清晰度倍率（2.0 = 2x Retina 高清）
card_scale = 2.0
# 发送完卡片图或立绘后立即结束本轮，不再追加多余文字
stop_planner_after_image = true

[cache]
# 页面 Wikitext 缓存有效期（小时）
page_ttl_hours = 168
# 立绘与图标本地 LRU 缓存上限（MB）
image_cache_max_mb = 200

[glossary]
# 自定义追加群内别称，格式："外号=标准PRTS词条名|简短定位(可选)"
# 例如：["大肥鱼=斯卡蒂|6★无畏者近卫"]
custom_aliases = []
