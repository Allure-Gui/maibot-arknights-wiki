# 明日方舟wiki插件 示例配置文件
# 请勿将包含你个人配置的 config.toml 提交到公开仓库

[plugin]
enabled = true
config_version = "0.3.1"

[scope]
# 群聊 / 私聊总开关（同时约束黑话感知 Hook、AI 工具与快捷指令）
allow_group = true
allow_private = true
# 群聊名单过滤模式："不限制" / "仅白名单" / "排除黑名单"（也兼容 off / whitelist / blacklist）
group_list_mode = "不限制"
# 支持纯群号、platform:群号（如 qq:123456）、Telegram 父群号、具体话题 ID 或群名
group_list = []
# 私聊名单过滤模式："不限制" / "仅白名单" / "排除黑名单"
private_list_mode = "不限制"
private_list = []

[context]
# 检测到群聊/私聊出现方舟黑话或干员名时，向 Planner 尾部追加简短参考小抄（≤180字）
enable_planner_hint = true
# 命中方舟语境时提醒 Replyer 用自然玩家口吻聊天，不长篇背百科
enable_replyer_style_hint = true
# 命中高置信方舟词后，该会话保持方舟讨论热态的秒数（用于辅助放行“叔叔”“小羊”等多义词）
hot_session_ttl_seconds = 300
# 单轮最多注入的词条参考数
max_hint_items = 6

[commands]
# 是否启用快捷斜杠指令（/方舟、/方舟帮助、/立绘、/公招）
enable_commands = true
# 允许在群聊中执行「清理缓存」「增删自定义黑话」的管理员用户 ID 列表
# 支持 platform:用户ID；留空时读取宿主 plugin.permission（保留旧键回退），均未配置时仅允许已识别的私聊
admin_users = []

[prts]
api_url = "https://prts.wiki/api.php"
user_agent = "MaiBot-ArknightsWiki/0.3.1 (+https://github.com/Allure-Gui/maibot-arknights-wiki)"
timeout_seconds = 12.0
min_request_interval_ms = 500
# 立绘清晰度宽度上限（像素，1600 高清且原图≤3.5MB直出无损；0 表示始终原图）
illustration_thumb_width = 1600

[render]
# 是否开启黑曜石与金箔风格 2x Retina 卡片图渲染（材料/模组/干员面板/总帮助图）
enable_cards = true
# 聊天中群友询问材料/模组时，自动附发一张高清卡片图
auto_card_in_chat = true
# 卡片清晰度倍率（2.0 = 2x Retina 高清）
card_scale = 2.0
# 发送完卡片图或立绘后立即结束本轮，不再追加多余文字
stop_planner_after_image = true

[reminder]
# 开启后，在限时活动即将关闭时按设定时间自动推送到符合群聊黑/白名单的群聊（默认关闭）
enable_event_reminder = false
# 每日推送提醒的小时（北京时间 0~23，默认早上 9 点）
reminder_hour = 9
# 距离结束不足多少小时时触发提醒（默认 24 小时内，每期每群仅提醒一次）
remind_before_hours = 24
# 是否同时提醒即将结束的限时寻访卡池
include_gacha = true

[cache]
# 页面 Wikitext 缓存有效期（小时）
page_ttl_hours = 168
# 立绘与图标本地 LRU 缓存上限（MB）
image_cache_max_mb = 200

[glossary]
# 自定义黑话/昵称列表（优先覆盖内置词典）
# 支持格式："外号=干员名"、"外号=干员名|简短定位"、"外号:干员名" 或 "外号 干员名"
# 例：["牢猫=凯尔希|6★医疗", "大肥鱼=斯卡蒂"]
custom_aliases = []
# 开启后，自定义的昵称直接高置信命中（无需等待上下文热态）
custom_alias_force_tier1 = true
